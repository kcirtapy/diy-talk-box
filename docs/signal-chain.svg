<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DIY talk box signal chain and wiring</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- background (keeps it readable in GitHub dark mode) -->
  <rect x="0.5" y="0.5" width="999" height="559" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ===== top row: computer -> amp ===== -->
  <rect x="300" y="60" width="200" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Computer</text>
  <text x="400" y="117" text-anchor="middle" font-size="12.5" fill="#475569">DAW + synth plugin</text>

  <rect x="620" y="60" width="170" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="705" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Mini amp</text>
  <text x="705" y="117" text-anchor="middle" font-size="12.5" fill="#475569">own DC power supply</text>

  <line x1="502" y1="100" x2="616" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="559" y="90" text-anchor="middle" font-size="12.5" fill="#334155">USB or aux</text>

  <!-- ===== speaker wiring: + through the capacitor, - straight ===== -->
  <line x1="675" y1="140" x2="675" y2="226" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="659" y1="226" x2="691" y2="226" stroke="#dc2626" stroke-width="3.5"/>
  <line x1="659" y1="236" x2="691" y2="236" stroke="#dc2626" stroke-width="3.5"/>
  <line x1="675" y1="236" x2="675" y2="330" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="735" y1="140" x2="735" y2="330" stroke="#0f172a" stroke-width="2.5"/>

  <text x="662" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">+</text>
  <text x="749" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">−</text>

  <text x="648" y="225" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">33 µF capacitor</text>
  <text x="648" y="243" text-anchor="end" font-size="12.5" fill="#475569">non-polarized,</text>
  <text x="648" y="259" text-anchor="end" font-size="12.5" fill="#475569">blocks the bass</text>

  <text x="752" y="225" font-size="12.5" fill="#475569">speaker wire,</text>
  <text x="752" y="242" font-size="12.5" fill="#475569">one channel only</text>

  <!-- ===== driver, adapter, tube ===== -->
  <rect x="600" y="330" width="210" height="72" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="705" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Compression driver</text>
  <text x="705" y="384" text-anchor="middle" font-size="12.5" fill="#475569">Sound Town MHF-014 · 8 Ω</text>

  <polygon points="670,402 740,402 717,442 693,442" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="752" y="427" font-size="12.5" fill="#475569">3D-printed adapter</text>

  <path d="M705 442 C705 515 580 475 474 472" fill="none" stroke="#60a5fa" stroke-width="13" stroke-linecap="round"/>
  <path d="M705 442 C705 515 580 475 474 472" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round"/>
  <text x="630" y="515" text-anchor="middle" font-size="12.5" fill="#475569">talk box tube</text>

  <!-- ===== mouth -> mic -> computer ===== -->
  <ellipse cx="400" cy="470" rx="74" ry="34" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="400" y="467" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Your mouth</text>
  <text x="400" y="486" text-anchor="middle" font-size="12" fill="#475569">shapes the words</text>

  <rect x="335" y="262" width="130" height="56" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Vocal mic</text>
  <text x="400" y="304" text-anchor="middle" font-size="12" fill="#475569">records the result</text>

  <line x1="400" y1="434" x2="400" y2="322" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="383" font-size="12.5" fill="#334155">talking synth</text>

  <line x1="400" y1="260" x2="400" y2="144" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== rules callout ===== -->
  <rect x="40" y="190" width="240" height="178" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="58" y="219" font-size="14" font-weight="700" fill="#78350f">Rules that keep it alive</text>
  <text x="58" y="247" font-size="13" fill="#78350f">• Capacitor in series on +</text>
  <text x="58" y="271" font-size="13" fill="#78350f">• One amp channel only</text>
  <text x="58" y="295" font-size="13" fill="#78350f">• Only the synth goes to the amp</text>
  <text x="58" y="319" font-size="13" fill="#78350f">• Start with the volume at zero</text>
  <text x="58" y="343" font-size="13" fill="#78350f">• Bright patches, not bass</text>
</svg>
